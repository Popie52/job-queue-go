services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kali
      POSTGRES_DB: jobqueue
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:kali@db:5432/jobqueue?sslmode=disable
    ports:
      - "8080:8080"